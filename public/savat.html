<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALLAYM - Savat (Cart)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7ZFGK6W9YV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7ZFGK6W9YV');
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        teal: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e'
                        },
                        gold: {
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 50%, #0f766e 100%);
        }
        .btn-primary {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            color: #0f766e;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(250, 204, 21, 0.4);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(20, 184, 166, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.4);
        }
        .input-field {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: #facc15;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
        }
        .cart-card {
            transition: all 0.3s ease;
        }
        .cart-card:hover {
            transform: translateY(-2px);
        }
        .quantity-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .quantity-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    <!-- Navbar -->
    <nav class="glass fixed w-full z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-8">
                    <a href="index.html" class="text-3xl font-bold bg-gradient-to-r from-gold-500 to-gold-600 bg-clip-text text-transparent">HALLAYM</a>
                    <div class="hidden md:flex space-x-8">
                        <a href="market.html" class="text-teal-300 font-semibold hover:text-white transition-colors">Market</a>
                        <a href="wishlist.html" class="text-teal-200 hover:text-teal-100 transition-colors">Sevimlilar</a>
                        <a href="savat.html" class="text-gold-400 font-semibold">Savat</a>
                        <a href="history.html" class="text-teal-200 hover:text-teal-100 transition-colors">Buyurtmalar</a>
                        <a href="blog.html" class="text-teal-200 hover:text-teal-100 transition-colors">Blog</a>
                        <a href="profile.html" class="text-teal-200 hover:text-teal-100 transition-colors">Profil</a>
                        <a href="add-product.html" id="addProductLink" class="text-gold-400 font-semibold hidden">Mahsulot Qo'shish</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="userInfo" class="text-teal-100 font-medium"></span>
                    <button onclick="logout()" class="btn-danger px-6 py-2 rounded-full text-sm">Chiqish</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="pt-20 max-w-6xl mx-auto py-8 px-4">
        <h1 class="text-4xl font-bold mb-6 flex items-center">
            <i class="fas fa-shopping-cart mr-3 text-gold-400"></i>
            Savat (Cart)
        </h1>

        <!-- Savat bo'sh yoki to'la -->
        <div id="cartEmpty" class="text-center py-16 hidden">
            <div class="text-teal-300 text-8xl mb-6">🛒</div>
            <h3 class="text-3xl font-bold text-white mb-4">Savat bo'sh</h3>
            <p class="text-teal-200 text-lg mb-6">Sevimlilardan yoki marketdan mahsulotlar qo'shing!</p>
            <a href="market.html" class="btn-primary inline-block px-8 py-4 rounded-xl font-semibold text-lg">
                Marketga o'ting
            </a>
        </div>

        <!-- Savat to'la -->
        <div id="cartFull" class="hidden">
            <!-- Mahsulotlar ro'yxati -->
            <div id="cartItemsContainer" class="space-y-6 mb-8">
                <!-- Mahsulotlar yuklanadi -->
            </div>

            <!-- Jami hisob -->
            <div class="glass rounded-3xl p-6 mb-8">
                <div class="flex justify-between items-center text-xl">
                    <span class="text-teal-200 font-semibold">Jami:</span>
                    <span class="text-3xl font-bold text-gold-400" id="cartTotal">0 so'm</span>
                </div>
                <div class="flex space-x-3 mt-4">
                    <button onclick="clearCart()" class="flex-1 btn-danger py-3 rounded-xl font-semibold">
                        <i class="fas fa-trash mr-2"></i>Savatni tozalash
                    </button>
                    <a href="payment.html" id="checkoutBtn" class="flex-1 btn-secondary py-3 rounded-xl font-semibold text-center disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-credit-card mr-2"></i>To'lovga o'tish
                    </a>
                </div>
            </div>
        </div>

        <!-- Yuklash indikatori -->
        <div id="loadingIndicator" class="text-center py-12 hidden">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gold-400 border-t-transparent"></div>
            <p class="mt-4 text-teal-200 font-semibold">Savat yuklanmoqda...</p>
        </div>
    </div>

    <script>
        let currentUser = null;
        let cartItems = [];

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadCart();
        });

        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            if (!token || !user) {
                window.location.href = 'register-login.html';
                return;
            }
            currentUser = JSON.parse(user);
            document.getElementById('userInfo').textContent = `@${currentUser.username}`;
            if (currentUser.isPremium) {
                document.getElementById('addProductLink').classList.remove('hidden');
            }
        }

        async function loadCart() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const cartFull = document.getElementById('cartFull');
            const cartEmpty = document.getElementById('cartEmpty');
            const cartItemsContainer = document.getElementById('cartItemsContainer');

            loadingIndicator.classList.remove('hidden');
            cartFull.classList.add('hidden');
            cartEmpty.classList.add('hidden');

            const token = localStorage.getItem('token');
            if (!token) {
                alert('Sessiya tugadi. Qayta kiring.');
                window.location.href = 'register-login.html';
                return;
            }

            try {
                const response = await fetch('/api/cart', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Savat yuklashda xatolik');
                }

                cartItems = data;
                if (cartItems.length === 0) {
                    cartEmpty.classList.remove('hidden');
                } else {
                    displayCartItems(cartItems);
                    updateCartTotal();
                    cartFull.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Xatolik:', error);
                cartItemsContainer.innerHTML = `
                    <div class="glass p-6 rounded-3xl text-center">
                        <i class="fas fa-exclamation-triangle text-6xl text-red-400 mb-4"></i>
                        <p class="text-red-300 font-semibold text-xl mb-2">Xatolik!</p>
                        <p class="text-teal-200">${error.message}</p>
                        <button onclick="loadCart()" class="btn-danger mt-4 px-6 py-3 rounded-xl font-semibold">
                            Qayta yuklash
                        </button>
                    </div>
                `;
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        function displayCartItems(items) {
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = items.map(item => {
                const product = item.product;
                const price = product.discountPrice || product.price;
                const img = product.images?.[0] || 'https://via.placeholder.com/80?text=No+Image';
                const productLink = `product-detail.html?id=${product._id}`;
                return `
                    <div class="cart-card glass rounded-3xl p-6 flex items-center space-x-4">
                        <a href="${productLink}">
                            <img src="${img}" alt="${product.name}" class="w-20 h-20 object-cover rounded-xl">
                        </a>
                        <div class="flex-1">
                            <h3 class="font-bold text-white mb-2">
                                <a href="${productLink}" class="hover:text-gold-400">${product.name}</a>
                            </h3>
                            <p class="text-teal-200 text-sm mb-2">${getCategoryText(product.category)}</p>
                            <div class="flex items-center space-x-2 mb-2">
                                <span class="text-xl font-bold text-gold-400">${price.toLocaleString()} so'm</span>
                                <span class="text-sm text-teal-300">x ${item.quantity}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="updateQuantity('${item._id}', -1)" class="quantity-btn px-3 py-1 rounded">-</button>
                            <span class="px-3 py-1 bg-white/10 rounded">${item.quantity}</span>
                            <button onclick="updateQuantity('${item._id}', 1)" class="quantity-btn px-3 py-1 rounded">+</button>
                        </div>
                        <button onclick="removeFromCart('${item._id}')" class="btn-danger px-4 py-1 rounded text-sm">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function getCategoryText(category) {
            const map = {
                'instagram': 'Instagram Hisoblari',
                'tiktok': 'TikTok Hisoblari',
                'youtube': 'YouTube Kanallari',
                'websites': 'Tayyor Veb-saytlar',
                'domains': 'Domenlar va Hosting',
                'likee': 'Likee Hisoblari',
                'facebook': 'Facebook Hisoblari',
                'pubg': 'PUBG Hisoblari',
                'freefire': 'Free Fire hisoblari'
            };
            return map[category] || category;
        }

        function updateCartTotal() {
            const total = cartItems.reduce((sum, item) => {
                const price = item.product.discountPrice || item.product.price;
                return sum + (price * item.quantity);
            }, 0);
            document.getElementById('cartTotal').textContent = `${total.toLocaleString()} so'm`;
            const checkoutBtn = document.getElementById('checkoutBtn');
            if (total > 0) {
                checkoutBtn.classList.remove('disabled');
                checkoutBtn.href = `payment.html?type=product&amount=${total}&description=Savat mahsulotlari`;
            } else {
                checkoutBtn.classList.add('disabled');
                checkoutBtn.href = '#';
            }
        }

        async function updateQuantity(itemId, change) {
            const item = cartItems.find(i => i._id === itemId);
            if (!item) return;
            const newQuantity = Math.max(1, item.quantity + change);
            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`/api/cart/${itemId}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ quantity: newQuantity })
                });
                if (response.ok) {
                    const updatedItem = await response.json();
                    const index = cartItems.findIndex(i => i._id === itemId);
                    cartItems[index] = updatedItem;
                    displayCartItems(cartItems);
                    updateCartTotal();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Miqdor yangilashda xatolik');
                }
            } catch (error) {
                console.error('Xatolik:', error);
                alert('Miqdor yangilashda xatolik yuz berdi');
            }
        }

        async function removeFromCart(itemId) {
            if (!confirm('Savatdan o\'chirishni xohlaysizmi?')) return;
            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`/api/cart/${itemId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    cartItems = cartItems.filter(i => i._id !== itemId);
                    displayCartItems(cartItems);
                    updateCartTotal();
                    showToast('Savatdan o\'chirildi!');
                    if (cartItems.length === 0) {
                        document.getElementById('cartEmpty').classList.remove('hidden');
                        document.getElementById('cartFull').classList.add('hidden');
                    }
                } else {
                    const data = await response.json();
                    alert(data.error || 'O\'chirishda xatolik');
                }
            } catch (error) {
                console.error('Xatolik:', error);
                alert('O\'chirishda xatolik yuz berdi');
            }
        }

        async function clearCart() {
            if (!confirm('Butun savatni tozalashni xohlaysizmi?')) return;
            const token = localStorage.getItem('token');
            try {
                const response = await fetch('/api/cart/clear', {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    cartItems = [];
                    displayCartItems(cartItems);
                    updateCartTotal();
                    document.getElementById('cartEmpty').classList.remove('hidden');
                    document.getElementById('cartFull').classList.add('hidden');
                    showToast('Savat tozalandi!');
                } else {
                    const data = await response.json();
                    alert(data.error || 'Tozalashda xatolik');
                }
            } catch (error) {
                console.error('Xatolik:', error);
                alert('Tozalashda xatolik yuz berdi');
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-xl z-50 shadow-lg';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function logout() {
            if (confirm('Chiqmoqchimisiz?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'register-login.html';
            }
        }
    </script>
</body>
</html>
