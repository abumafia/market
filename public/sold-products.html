    <script>
        let currentUser = null;
        let soldProducts = [];
        let currentPage = 1;
        let hasMoreProducts = true;
        let isLoadingMore = false;
        const pageSize = 12; // Har safar 12 ta yuklash

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadSoldProducts();
            setupEventListeners();
            setupMobileMenu();
            setupLazyLoading();
            setupInfiniteScroll();
        });

        function setupMobileMenu() {
            const btn = document.getElementById('mobileMenuBtn');
            const menu = document.getElementById('mobileMenu');
            btn.addEventListener('click', () => {
                const isOpen = menu.classList.contains('hidden');
                if (isOpen) {
                    menu.classList.remove('hidden');
                    menu.style.maxHeight = menu.scrollHeight + 'px';
                    btn.closest('nav').classList.add('menu-open');
                } else {
                    menu.style.maxHeight = '0px';
                    setTimeout(() => {
                        menu.classList.add('hidden');
                        btn.closest('nav').classList.remove('menu-open');
                    }, 300);
                }
            });
            document.querySelectorAll('#mobileMenu a').forEach(link => {
                link.addEventListener('click', () => {
                    menu.style.maxHeight = '0px';
                    setTimeout(() => menu.classList.add('hidden'), 300);
                });
            });
        }

        function setupLazyLoading() {
            const images = document.querySelectorAll('.lazy-img');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src || img.src;
                        img.classList.add('loaded');
                        observer.unobserve(img);
                    }
                });
            }, { threshold: 0.1 });
            images.forEach(img => observer.observe(img));
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            if (!token || !user) {
                window.location.href = 'register-login.html';
                return;
            }
            currentUser = JSON.parse(user);
            document.getElementById('userInfo').textContent = `@${currentUser.username}`;
            if (currentUser.isPremium) {
                document.getElementById('addProductLink').classList.remove('hidden');
                document.getElementById('addProductLinkMobile').classList.remove('hidden');
            }
        }

        function setupEventListeners() {
            document.getElementById('categoryFilter').addEventListener('change', resetAndLoad);
            document.getElementById('dateFilter').addEventListener('change', resetAndLoad);
        }

        function resetAndLoad() {
            currentPage = 1;
            soldProducts = [];
            hasMoreProducts = true;
            loadSoldProducts();
        }

        async function loadSoldProducts(isInfinite = false) {
            if (isLoadingMore && isInfinite) return;

            const loadingIndicator = document.getElementById('loadingIndicator');
            const infiniteLoading = document.getElementById('infiniteLoading');
            const container = document.getElementById('soldProductsContainer');
            const noMessage = document.getElementById('noSoldMessage');

            if (!isInfinite) {
                loadingIndicator.classList.remove('hidden');
                container.innerHTML = '';
                noMessage.classList.add('hidden');
            } else {
                infiniteLoading.classList.remove('hidden');
                infiniteLoading.classList.add('show');
            }

            isLoadingMore = true;

            const token = localStorage.getItem('token');
            if (!token) {
                alert('Sessiya tugadi. Qayta kiring.');
                window.location.href = 'register-login.html';
                return;
            }

            try {
                const category = document.getElementById('categoryFilter').value;
                const date = document.getElementById('dateFilter').value;
                const params = new URLSearchParams();
                if (category) params.append('category', category);
                if (date) params.append('date', date);
                params.append('page', currentPage);
                params.append('limit', pageSize);

                const response = await fetch(`/api/sold-products?${params.toString()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || 'Yuklashda xatolik');
                }
                const data = await response.json();

                const validProducts = data.filter(order => order.product && order.product.category); // Null productlarni filtrlab chiqarish
                soldProducts = isInfinite ? [...soldProducts, ...validProducts] : validProducts;

                hasMoreProducts = validProducts.length === pageSize;

                if (isInfinite) {
                    displayAdditionalProducts(validProducts);
                } else {
                    displaySoldProducts(soldProducts);
                }

                if (!hasMoreProducts && isInfinite) {
                    showNoMoreMessage();
                }
            } catch (error) {
                console.error('Xatolik:', error);
                if (!isInfinite) {
                    container.innerHTML = `
                        <div class="glass p-4 sm:p-6 rounded-3xl text-center">
                            <i class="fas fa-exclamation-triangle text-4xl sm:text-6xl text-red-400 mb-2 sm:mb-4"></i>
                            <p class="text-red-300 font-semibold text-base sm:text-xl mb-2">Xatolik!</p>
                            <p class="text-teal-200 text-sm sm:text-base">${error.message}</p>
                            <button onclick="resetAndLoad()" class="btn-danger mt-3 sm:mt-4 px-4 sm:px-6 py-2 sm:py-3 rounded-xl font-semibold text-sm">
                                Qayta yuklash
                            </button>
                        </div>
                    `;
                } else {
                    showToast('Yana yuklashda xatolik yuz berdi');
                }
            } finally {
                isLoadingMore = false;
                if (!isInfinite) {
                    loadingIndicator.classList.add('hidden');
                } else {
                    infiniteLoading.classList.add('hidden');
                    infiniteLoading.classList.remove('show');
                }
            }
        }

        function displaySoldProducts(products) {
            const container = document.getElementById('soldProductsContainer');
            const noMessage = document.getElementById('noSoldMessage');

            if (products.length === 0) {
                noMessage.classList.remove('hidden');
                return;
            }

            // Kategoriyaga qarab guruhlash
            const grouped = products.reduce((acc, order) => {
                if (!order.product || !order.product.category) return acc;
                const cat = getCategoryText(order.product.category);
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(order);
                return acc;
            }, {});

            let html = '';
            Object.keys(grouped).sort().forEach(category => {
                html += `
                    <div class="mb-6 sm:mb-8">
                        <h2 class="text-xl sm:text-2xl font-bold mb-4 flex items-center text-gold-400">
                            <i class="fas fa-folder mr-2"></i>${category} (${grouped[category].length} ta sotilgan)
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                `;
                grouped[category].forEach((order, index) => {
                    html += renderSoldProductCard(order, index);
                });
                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        function displayAdditionalProducts(newProducts) {
            const container = document.getElementById('soldProductsContainer');
            newProducts.forEach((order, index) => {
                const card = renderSoldProductCard(order, soldProducts.length + index);
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        function renderSoldProductCard(order, globalIndex) {
            const sellerLink = `profile.html?userId=${order.seller._id}`;
            const buyerLink = `profile.html?userId=${order.buyer._id}`;
            const productLink = `product-detail.html?id=${order.product._id}`;
            const img = order.product.images?.[0] || 'https://via.placeholder.com/200?text=No+Image';
            const remainingStock = order.product.stock || 0;
            const stockText = remainingStock > 0 ? `${remainingStock} dona qoldi` : 'To\'liq sotildi';
            const stockColor = remainingStock > 0 ? 'text-yellow-400' : 'text-red-300';
            return `
                <div class="sold-card rounded-2xl sm:rounded-3xl p-3 sm:p-4 card-hover fade-in-up" style="animation-delay: ${globalIndex * 0.1}s">
                    <a href="${productLink}" class="block mb-3">
                        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-src="${img}" alt="${order.product.name}" class="w-full h-40 sm:h-48 object-cover rounded-xl lazy-img">
                    </a>
                    <h3 class="font-bold text-white mb-2 line-clamp-1 text-sm sm:text-base">
                        <a href="${productLink}" class="hover:text-gold-400 profile-link">${order.product.name}</a>
                    </h3>
                    <div class="space-y-2 text-xs sm:text-sm mb-3">
                        <div class="flex justify-between items-center">
                            <span class="text-teal-200">Sotuvchi:</span>
                            <a href="${sellerLink}" class="profile-link font-semibold text-teal-100 hover:text-gold-400">${order.seller.username}</a>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-teal-200">Xaridor:</span>
                            <a href="${buyerLink}" class="profile-link font-semibold text-teal-100 hover:text-gold-400">${order.buyer.username}</a>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-teal-200">Miqdor:</span>
                            <span class="font-semibold text-green-300">${order.quantity} dona</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-teal-200">Stok holati:</span>
                            <span class="${stockColor} font-semibold">${stockText}</span>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-teal-500/30">
                            <span class="text-teal-200">Jami narx:</span>
                            <span class="text-lg sm:text-xl font-bold text-gold-400">${order.totalPrice.toLocaleString()} so'm</span>
                        </div>
                    </div>
                    <span class="block w-full text-center mt-2 px-3 py-1 rounded-full text-xs font-semibold status-sold">✅ Sotildi</span>
                    <p class="text-xs text-teal-300 mt-2 text-center sm:text-left">${new Date(order.createdAt).toLocaleDateString('uz-UZ')} da sotildi</p>
                </div>
            `;
        }

        function getCategoryText(category) {
            if (!category) return 'Noma\'lum';
            const map = {
                'instagram': 'Instagram Hisoblari',
                'tiktok': 'TikTok Hisoblari',
                'youtube': 'YouTube Kanallari',
                'websites': 'Tayyor Veb-saytlar',
                'domains': 'Domenlar va Hosting',
                'likee': 'Likee Hisoblari',
                'facebook': 'Facebook Hisoblari',
                'pubg': 'PUBG Hisoblari',
                'freefire': 'Free Fire hisoblari'
            };
            return map[category] || category;
        }

        function setupInfiniteScroll() {
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (ticking) return;
                requestAnimationFrame(() => {
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000 && hasMoreProducts && !isLoadingMore) {
                        currentPage++;
                        loadSoldProducts(true);
                    }
                    ticking = false;
                });
                ticking = true;
            });
        }

        function showNoMoreMessage() {
            const container = document.getElementById('soldProductsContainer');
            container.insertAdjacentHTML('beforeend', `
                <div class="text-center py-8 sm:py-12 col-span-full">
                    <i class="fas fa-check-circle text-4xl sm:text-6xl text-green-400 mb-2 sm:mb-4"></i>
                    <p class="text-teal-200 text-sm sm:text-base">Barcha sotilgan mahsulotlar yuklandi</p>
                </div>
            `);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-xl z-50 shadow-lg';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function applyFilters() {
            resetAndLoad();
        }

        function clearFilters() {
            document.getElementById('categoryFilter').value = '';
            document.getElementById('dateFilter').value = '';
            resetAndLoad();
        }

        function logout() {
            if (confirm('Chiqmoqchimisiz?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'register-login.html';
            }
        }
    </script>
</body>
</html>
